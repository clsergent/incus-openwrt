name: Build Incus OpenWrt APK packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Hardware target
        type: choice
        required: true
        default: rk3582
        options:
          - filogic
          - rk3582

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch'
          && fromJSON(format('["{0}"]', inputs.target))
          || fromJSON('["filogic","rk3582"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag incus-openwrt-builder \
            .

      - name: Build standalone APK
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/output/$TARGET"

          docker run --rm \
            --platform linux/arm64 \
            -e BUILD_IN_CONTAINER=1 \
            -e BUILD_TARGET="$TARGET" \
            -v "$GITHUB_WORKSPACE/output/$TARGET:/output" \
            incus-openwrt-builder

          apk_count="$(find "output/$TARGET/pkg" -maxdepth 1 \
            -type f -name "incus-openwrt-$TARGET-*.apk" | wc -l)"
          test "$apk_count" -eq 1
          ls -lh "output/$TARGET/pkg/"*.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: incus-openwrt-${{ matrix.target }}
          path: output/${{ matrix.target }}/pkg/*.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download target APKs
        uses: actions/download-artifact@v4
        with:
          pattern: incus-openwrt-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -eu
          for target in filogic rk3582; do
            count="$(find release-assets -maxdepth 1 \
              -type f -name "incus-openwrt-$target-*.apk" | wc -l)"
            test "$count" -eq 1
          done
          ls -lh release-assets/*.apk

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true