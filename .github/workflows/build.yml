name: Build Incus OpenWrt APK packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Hardware target
        type: choice
        required: true
        default: rk3582
        options:
          - filogic
          - rk3582

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch'
          && fromJSON(format('["{0}"]', inputs.target))
          || fromJSON('["filogic","rk3582"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Prepare signing key
        env:
          INCUS_SIGN_KEY: ${{ secrets.INCUS_SIGN_KEY }}
        run: |
          set -eu
          test -n "$INCUS_SIGN_KEY" || {
            echo "INCUS_SIGN_KEY secret is required" >&2
            exit 1
          }
          printf '%s' "$INCUS_SIGN_KEY" > "$RUNNER_TEMP/incus-sign-key.pem"
          chmod 600 "$RUNNER_TEMP/incus-sign-key.pem"

      - name: Build container image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag incus-openwrt-builder \
            .

      - name: Build target packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output/${{ matrix.target }}"
          docker run --rm \
            --platform linux/arm64 \
            -e BUILD_IN_CONTAINER=1 \
            -e BUILD_TARGET="${{ matrix.target }}" \
            -v "$GITHUB_WORKSPACE/output/${{ matrix.target }}:/output" \
            --mount "type=bind,src=$RUNNER_TEMP/incus-sign-key.pem,dst=/run/secrets/incus_sign_key,readonly" \
            incus-openwrt-builder

      - name: Upload APK packages
        uses: actions/upload-artifact@v4
        with:
          name: incus-openwrt-packages-${{ matrix.target }}
          path: output/${{ matrix.target }}/*
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/incus-sign-key.pem"